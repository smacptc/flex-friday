<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flex Friday</title>

<!-- home screen icon and standalone mode. iOS reads the apple- tags, Android reads the manifest. -->
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="/apple-touch-icon-precomposed.png?v=2">
<link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167.png?v=2">
<link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152.png?v=2">
<link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon-120.png?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=2">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flex Friday">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#131E2C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
  :root{
    --night:#131E2C; --panel:#1D2C3F; --panel2:#27394F; --edge:#080F17;
    --chalk:#F0F4F8; --dim:#93A6BA;
    --turf:#2F7D4F; --amber:#FFC53D; --red:#E2574C; --green:#4CC17E; --void:#8FA3B8;
    --pix:"Press Start 2P","Courier New",monospace;
    --big:"Silkscreen","Press Start 2P",monospace;
    --body:"Silkscreen","Courier New",monospace;
  }
  *{box-sizing:border-box;font-synthesis:none}
  body,button,input,textarea,table{-webkit-font-smoothing:none;-moz-osx-font-smoothing:grayscale;font-smooth:never}
  html,body{margin:0;padding:0}
  body{
    background:var(--night);
    color:var(--chalk);font-family:var(--body);font-size:16px;line-height:1.5;letter-spacing:0;
  }
  svg{image-rendering:pixelated}
  .sprite{display:block}
  .sprite.dim{opacity:.85}
  .wrap{max-width:640px;margin:0 auto;
    padding:calc(16px + env(safe-area-inset-top)) 14px calc(64px + env(safe-area-inset-bottom))}
  button{font-family:var(--pix);font-size:8px;line-height:1.5;cursor:pointer}
  button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
  input{font-family:var(--body);font-size:16px}
  h1,h2,h3,h4{margin:0;font-family:var(--pix);font-weight:400;line-height:1.5}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 16px;flex-wrap:wrap}
  .poolname{font-family:var(--big);font-weight:700;font-size:24px;color:#fff;letter-spacing:1px;text-transform:uppercase;text-shadow:3px 3px 0 #000}
  .navlinks{display:flex;gap:8px}
  .linkbtn{background:var(--panel2);border:2px solid var(--edge);color:var(--chalk);padding:6px 8px;font-size:8px}
  .linkbtn:active{transform:translate(2px,2px)}

  .board{
    background:var(--turf);
    background-image:repeating-linear-gradient(90deg,transparent 0 34px,rgba(255,255,255,.14) 34px 36px);
    border:3px solid var(--edge);box-shadow:6px 6px 0 var(--edge);padding:16px 14px 14px;color:#fff
  }
  .weekrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .weekrow h2{font-family:var(--big);font-weight:700;font-size:24px;letter-spacing:1px;text-transform:uppercase;text-shadow:3px 3px 0 #000}
  .weeknav{display:flex;gap:6px}
  .weeknav button{width:34px;height:34px;border:2px solid var(--edge);background:rgba(0,0,0,.28);color:#fff;padding:0;font-size:8px}
  .weeknav button:disabled{opacity:.3;cursor:default}
  .clock{font-family:var(--big);font-weight:700;font-size:32px;color:#fff;
    letter-spacing:1px;text-transform:uppercase;text-shadow:4px 4px 0 rgba(0,0,0,.55);margin:14px 0 6px}
  .clocklabel{font-size:16px;color:rgba(255,255,255,.9)}
  .fill{display:flex;gap:2px;margin-top:12px}
  .fill i{flex:1;height:10px;background:rgba(0,0,0,.3);border:1px solid rgba(0,0,0,.35)}
  .fill i.on{background:var(--amber)}

  .card{background:var(--panel);border:4px solid #fff;box-shadow:8px 8px 0 rgba(0,0,0,.65);padding:14px;margin-top:20px}
  .card h3{font-family:var(--big);font-weight:700;font-size:16px;color:#fff;letter-spacing:1px;text-transform:uppercase;text-shadow:3px 3px 0 var(--edge);margin-bottom:8px}
  .hint{color:var(--dim);font-size:16px}
  .rule{background:#16222F;border-left:6px solid var(--amber);padding:8px 10px;margin:10px 0 0;font-size:16px}

  label{display:block;font-family:var(--pix);font-size:8px;color:var(--dim);margin:14px 0 6px}
  input[type=text],input[type=password],textarea{width:100%;padding:11px;border:4px solid var(--edge);background:#0F1926;color:var(--chalk)}
  textarea{font-family:var(--body);font-size:16px;line-height:1.5;resize:vertical}
  .two{display:grid;grid-template-columns:1fr 96px;gap:10px}
  .side{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
  .side button{border:3px solid #fff;background:var(--panel2);color:var(--dim);padding:11px 4px;font-family:var(--big);font-weight:700;font-size:16px}
  .side button[aria-pressed=true]{background:var(--amber);color:#1A1206}

  .btn{background:var(--amber);color:#1A1206;border:4px solid var(--edge);box-shadow:6px 6px 0 var(--edge);
    padding:11px 14px;margin-top:16px;font-family:var(--big);font-weight:700;font-size:16px;text-shadow:2px 2px 0 rgba(0,0,0,.35);letter-spacing:1px;text-transform:uppercase}
  .btn:active{transform:translate(6px,6px);box-shadow:none}
  .btn.ghost{background:var(--panel2);color:var(--chalk)}
  .btn.wide{width:100%}
  .btn:disabled{background:#4A5768;color:#94A3B4;cursor:default;box-shadow:4px 4px 0 var(--edge)}
  .row-btns{display:flex;gap:10px;flex-wrap:wrap}

  .whoami{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .whoami button{background:var(--panel2);border:3px solid var(--edge);padding:10px 8px;text-align:left;
    font-family:var(--body);font-size:16px;color:var(--chalk);display:flex;align-items:center;gap:8px}
  .whoami button:active{transform:translate(2px,2px)}
  .whoami small{display:block;color:var(--dim);font-size:8px}

  .preview{display:flex;align-items:center;gap:14px;margin-top:12px;background:#16222F;border:4px solid var(--edge);padding:12px}
  .preview .cap{font-family:var(--pix);font-size:8px;color:var(--dim)}
  .preview .cap b{display:block;color:var(--amber);font-size:8px;margin-bottom:4px}

  ul.legs{list-style:none;margin:8px 0 0;padding:0}
  ul.legs li{display:flex;gap:10px;padding:12px 0;border-top:2px solid #16222F}
  ul.legs li:first-child{border-top:0}
  .spritebox{width:60px;flex:none;background:#22496E;border:2px solid var(--edge);padding:3px;display:flex;align-items:center;justify-content:center;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.10) 0 5px,rgba(255,255,255,0) 5px 10px)}
  .leg{flex:1;min-width:0}
  .rowname{font-family:var(--big);font-weight:700;font-size:16px;color:#fff;letter-spacing:1px;text-transform:uppercase;text-shadow:2px 2px 0 var(--edge);margin-bottom:5px}
  .rowname span{color:var(--dim)}
  .leg .player{font-weight:700;word-wrap:break-word}
  .leg .prop{font-size:16px}
  .leg .note{color:var(--dim);font-size:16px;word-wrap:break-word}
  .miss{color:var(--red)}
  .tag{display:inline-block;font-family:var(--pix);font-size:8px;padding:5px 6px;border:2px solid var(--edge);
    background:var(--panel2);color:var(--dim);margin:2px 4px 2px 0}
  .tag.in{background:#1C4634;color:var(--green)}
  .tag.badge{background:#3D3113;color:var(--amber)}
  .more{color:var(--green);font-weight:700}
  .less{color:var(--red);font-weight:700}
  .margin{font-size:16px;font-weight:700;margin-top:5px}
  .margin.h{color:var(--green)} .margin.m{color:var(--red)} .margin.v{color:var(--void)}
  .marks{display:flex;gap:5px;margin-top:8px;align-items:center;flex-wrap:wrap}
  .marks button{border:2px solid var(--edge);background:var(--panel2);color:var(--dim);padding:0 9px;height:30px;font-size:8px}
  .marks button.on[data-r="H"]{background:var(--green);color:#08150E}
  .marks button.on[data-r="M"]{background:var(--red);color:#1B0806}
  .marks button.on[data-r="V"]{background:var(--void);color:#131E2C}
  .marks input{width:84px;padding:4px 6px;height:30px;border:2px solid var(--edge);background:#0F1926;color:var(--chalk)}
  .found{background:#2C2408;border:2px solid var(--amber);padding:8px;margin-top:8px;font-size:16px;color:var(--amber)}
  .found b{font-size:16px}
  .found button{margin-left:8px;border:2px solid var(--edge);background:var(--amber);color:#1A1206;padding:4px 7px;font-size:8px}
  .found.thin{background:#16222F;border-color:var(--edge);color:var(--dim)}
  .pulling{color:var(--amber);font-size:16px;margin-top:10px}

  .banner{background:#3D2411;border:3px solid #fff;box-shadow:6px 6px 0 rgba(0,0,0,.65);
    padding:12px;margin-bottom:16px;font-size:16px;color:#FFD98A;line-height:1.7}
  .banner b{display:block;font-family:var(--pix);font-size:8px;color:var(--amber);margin-bottom:6px}
  .banner .linkbtn{margin-top:8px;display:block}
  .rowname svg{vertical-align:-6px;margin-right:4px}
  td svg{vertical-align:-6px;margin-right:5px}
  .rcard{border:4px solid #fff;background:#151F2D;box-shadow:7px 7px 0 rgba(0,0,0,.65);overflow:hidden}
  .rcard.hit{border-color:#3E9E6B}
  .rcard.miss{border-color:#9B4038}
  .rcard.void{border-color:#6B7684}
  .rtop{background:#0C1622;display:flex;align-items:center;gap:6px;padding:4px 6px;
    font-family:var(--big);font-weight:700;font-size:16px;color:#fff;letter-spacing:1px;
    text-transform:uppercase;text-shadow:2px 2px 0 #000;line-height:1.3}
  .rtop svg{flex:none}
  .rport{position:relative;display:flex;align-items:flex-end;justify-content:center;height:84px;
    border-bottom:3px solid var(--edge);
    background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.10) 0 5px,rgba(255,255,255,0) 5px 10px)}
  .rpos em{font-style:normal;color:#FFD98A}
  .rpos{position:absolute;left:5px;top:3px;font-family:var(--big);font-weight:700;font-size:16px;
    color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.65);letter-spacing:1px}
  .rname{background:#59636F;color:#fff;font-family:var(--big);font-weight:700;font-size:16px;
    letter-spacing:1px;text-align:center;padding:3px 4px;text-shadow:2px 2px 0 rgba(0,0,0,.6);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rprop{background:#2B3441;color:#C2CEDA;font-size:16px;text-align:center;padding:4px 5px;line-height:1.35}
  .rbar{height:11px;background:#0C1622;border-top:2px solid var(--edge)}
  .rbar i{display:block;height:100%}
  .rfin{background:#0C1622;color:#93A6BA;font-family:var(--pix);font-size:8px;
    text-align:center;padding:5px 3px;line-height:1.5}
  .rcard.hit .rfin{color:#8FE8B4}
  .rcard.miss .rfin{color:#FFA79E}
  .cardgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .bigcount{font-family:var(--big);font-weight:700;letter-spacing:1px;font-size:48px;color:#fff;text-shadow:4px 4px 0 #000;margin:14px 0 6px}
  /* ---- the field ------------------------------------------------------- */
  .field{position:fixed;inset:0;z-index:-2;background:#2E7245;overflow:hidden}
  .field::after{content:"";position:absolute;inset:0;background:rgba(6,14,10,.42)}
  .turf{position:absolute;inset:0;display:flex;
    background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 64px,rgba(0,0,0,.06) 64px 128px)}
  .turf::before,.turf::after{content:"";position:absolute;left:0;right:0;height:0;
    border-top:3px dashed rgba(255,255,255,.5)}
  .turf::before{top:34%} .turf::after{top:66%}
  .yard{flex:1;border-right:4px solid rgba(255,255,255,.75);position:relative}
  .yard.first{border-left:4px solid rgba(255,255,255,.75)}
  .yn{position:absolute;left:50%;transform:translateX(-50%);
    font-family:var(--big);font-weight:700;font-size:32px;color:rgba(255,255,255,.8);
    letter-spacing:1px;text-shadow:3px 3px 0 rgba(0,0,0,.35);line-height:1}
  .yn.top{top:16px} .yn.bot{bottom:16px}
  @media (max-width:520px){ .yn{font-size:16px} .yard{border-right-width:3px} }
  .steps{list-style:none;margin:12px 0 0;padding:0;counter-reset:s}
  .steps li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:2px solid #16222F}
  .steps li:first-child{border-top:0}
  .steps b{font-family:var(--big);font-weight:700;font-size:16px;color:var(--amber);width:20px;flex:none;
    text-shadow:2px 2px 0 var(--edge)}
  .stepbody{flex:1;min-width:0}
  .stepname{font-weight:700;font-size:16px;word-wrap:break-word}
  .stepprop{font-size:16px;color:var(--dim);line-height:1.5}
  .stepcopy{border:3px solid var(--edge);background:var(--panel2);color:var(--chalk);
    font-family:var(--big);font-weight:700;font-size:16px;padding:6px 8px;flex:none}
  .stepcopy:active{transform:translate(2px,2px)}
  a.golink{display:inline-block;text-decoration:none;text-align:center}
  .slipwrap{position:relative;display:inline-block}
  .slipover{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px;z-index:2}
  .flav{display:inline-block;font-family:var(--pix);font-size:8px;padding:3px 5px;border:2px solid var(--edge);
    margin-left:5px;vertical-align:middle;line-height:1}
  .flav.demon{background:#E2574C;color:#150A08}
  .flav.goblin{background:#4CC17E;color:#08150D}
  .flav.low{background:#3E4A59;color:var(--chalk)}
  .sliplist{list-style:none;margin:10px 0 0;padding:0}
  .sliplist li{border-top:2px solid #16222F;padding:10px 0}
  .sliplist li:first-child{border-top:0}
  .slipow{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700}
  .slipow input{width:22px;height:22px;accent-color:var(--amber)}
  .slipleg{font-size:16px;margin-top:4px}
  .slipleg em{font-style:normal;color:var(--dim)}
  .slipfin{font-family:var(--pix);font-size:8px;color:var(--green);margin-top:4px;line-height:1.6}
  .slipfin.dim,.dim{color:var(--dim)}
  .slipwarn{font-size:16px;color:var(--amber);margin-top:4px}
  .rcard.lead .rname{color:var(--green)}
  .rcard.trail .rname{color:var(--red)}
  .livel{font-size:16px;margin-top:4px}
  .livel em{font-style:normal;font-family:var(--pix);font-size:8px;color:var(--dim);margin-left:4px}
  .warnline{color:var(--amber)}
  .pindots{display:flex;gap:12px;justify-content:center;margin:18px 0}
  .pindots span{width:20px;height:20px;border:4px solid var(--edge);background:#0F1926}
  .pindots span.on{background:var(--amber)}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
  .keypad button{font-family:var(--big);font-weight:700;font-size:24px;color:var(--chalk);
    background:var(--panel2);border:4px solid var(--edge);box-shadow:5px 5px 0 var(--edge);
    padding:16px 0;text-shadow:2px 2px 0 var(--edge)}
  .keypad button:active{transform:translate(5px,5px);box-shadow:none}
  .badgeicon{display:block}
  .medals{display:flex;flex-wrap:wrap;gap:14px 0;margin-top:8px}
  .medal{text-align:center;width:80px}
  .medal svg{margin:0 auto}
  .mart{position:relative;display:block;width:60px;height:60px;margin:0 auto}
  .mx{position:absolute;right:-8px;bottom:0;font-family:var(--pix);font-size:8px;font-weight:400;line-height:1;
    color:var(--chalk);background:var(--edge);border:2px solid #B87333;padding:3px 3px 2px}
  .medal.silver .mx{border-color:#BFC7D1}
  .medal.gold .mx{border-color:#F0B429}
  .mname{display:block;font-family:var(--pix);font-size:8px;color:var(--chalk);margin-top:6px;line-height:1.5;min-height:3em}
  .medal.locked .mname{color:#53677D}
  .medal.locked .mcount{color:#41536A}
  .mbar{display:block;width:52px;height:8px;margin:5px auto 0;background:#0F1926;border:2px solid var(--edge);box-sizing:content-box}
  .mbar i{display:block;height:100%}
  .mbar.silver i{background:#BFC7D1}
  .mbar.gold i{background:#F0B429}
  .mnext{display:block;font-family:var(--pix);font-size:8px;color:var(--dim);line-height:1.6;margin-top:4px}
  .medal[data-badge]{cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:0}
  .medal[data-badge]:active .mart{transform:translate(2px,2px)}
  .medal[data-badge]:focus-visible,.legrow[data-badge]:focus-visible{outline:2px dashed var(--amber);outline-offset:3px}
  @media (hover:hover){ .medal[data-badge]:hover .mname{text-decoration:underline} .legrow[data-badge]:hover b{text-decoration:underline} }
  .legrow[data-badge]{cursor:pointer;-webkit-tap-highlight-color:transparent}
  body.sheeton{overflow:hidden}
  .sheetback{position:fixed;inset:0;background:rgba(4,8,13,.72);z-index:60}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:560px;margin:0 auto;max-height:80vh;overflow-y:auto;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--panel);border-top:4px solid #fff;
    padding:18px 16px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -8px 0 rgba(0,0,0,.45)}
  @media (max-width:599px){ .sheet{animation:sheetup .18s ease-out} }
  @media (min-width:600px){ .sheet{bottom:auto;top:50%;transform:translateY(-50%);border:4px solid #fff;box-shadow:8px 8px 0 rgba(0,0,0,.65)} }
  @media (prefers-reduced-motion:reduce){ .sheet{animation:none} }
  @keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}
  .sheetx{position:absolute;right:12px;top:12px;width:40px;height:40px;font-family:var(--pix);font-size:12px;color:var(--chalk);
    background:var(--panel2);border:3px solid var(--edge);box-shadow:3px 3px 0 var(--edge);padding:0}
  .sheetx:active{transform:translate(3px,3px);box-shadow:none}
  .sheethead{display:flex;gap:14px;align-items:center;padding-right:44px}
  .sheethead .badgeicon{flex:none}
  .sheetname{font-family:var(--big);font-weight:700;font-size:20px;color:#fff;text-shadow:2px 2px 0 var(--edge);line-height:1.2}
  .sheettier{font-family:var(--pix);font-size:8px;line-height:1.8;margin-top:8px;color:var(--dim)}
  .sheettier.bronze{color:#E0A96D} .sheettier.silver{color:#EDF1F5} .sheettier.gold{color:#FFE08A}
  .sheetdesc{font-size:16px;color:var(--chalk);line-height:1.6;margin:14px 0 4px}
  .dwhy{font-family:var(--pix);font-size:8px;color:var(--amber);margin-top:6px;line-height:1.7}
  .dtier{padding:1px 3px;border:2px solid currentColor}
  .dtier.bronze{color:#E0A96D} .dtier.silver{color:#EDF1F5} .dtier.gold{color:#FFE08A}
  .sheetladder{display:block;color:var(--dim);margin-top:4px}
  .mwho{position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);max-width:78px;box-sizing:border-box;
    font-family:var(--pix);font-size:8px;line-height:1;color:var(--chalk);background:var(--edge);border:2px solid #B87333;
    padding:3px 4px 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .medal.silver .mwho{border-color:#BFC7D1}
  .medal.gold .mwho{border-color:#F0B429}
  .medal .mart + .mname{margin-top:8px}
  .sheetwho{font-size:16px;font-weight:700;color:var(--chalk);margin-top:4px}
  .sheetwho em,ul.holders em{font-style:normal;font-family:var(--pix);font-size:8px;color:var(--amber);margin-left:4px}
  ul.holders{list-style:none;margin:0;padding:0}
  ul.holders li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:2px solid #16222F;font-size:16px}
  ul.holders li:first-child{border-top:0}
  ul.holders b{font-family:var(--pix);font-size:8px;font-weight:400;align-self:center}
  ul.holders li.bronze b{color:#E0A96D} ul.holders li.silver b{color:#EDF1F5} ul.holders li.gold b{color:#FFE08A}
  .casecount{display:block;font-family:var(--pix);font-size:8px;color:var(--dim);margin:-2px 0 4px}

function playerPos(name){

function teamForPlayer(name){
  const k = normName(name);
  if(!k) return "";
  const tight = k.replace(/ /g,"");
  const extra = (state.season && state.season.roster) || {};
  const tightExtra = {};
  Object.keys(extra).forEach(x => { tightExtra[x.replace(/ /g,"")] = extra[x]; });
  return extra[k] || tightExtra[tight] || ROSTER_SEED[k] || TIGHT_SEED[tight] || "";
}
function rosterStamp(){
  const n = Object.keys((state.season && state.season.roster) || {}).length;
  return "Rosters from the " + ROSTER_VERSION + ", " + Object.keys(ROSTER_SEED).length + " players"
       + (n ? ", plus " + n + " correction" + (n === 1 ? "" : "s") : "");
}
function parseRosterPaste(text){
  const out = {}, bad = [];
  String(text || "").split(/[\n;]+/).forEach(line => {
    const raw = line.trim();
    if(!raw) return;
    let name = "", teamStr = "";
    const c = raw.lastIndexOf(","), d = raw.lastIndexOf(" - ");
    if(c > 0){ name = raw.slice(0, c); teamStr = raw.slice(c + 1); }
    else if(d > 0){ name = raw.slice(0, d); teamStr = raw.slice(d + 3); }
    else {
      const w = raw.split(/\s+/);
      for(let take = 3; take >= 1; take--){
        if(w.length <= take) continue;
        const cand = w.slice(-take).join(" ");
        if(teamOf(cand)){ name = w.slice(0, -take).join(" "); teamStr = cand; break; }
      }
    }
    const t = teamOf(teamStr), who = normName(name);
    if(!t || !who){ bad.push(raw); return; }
    out[who] = t.k;
  });
  return {map: out, bad: bad};
}

/* ---- name lookup ------------------------------------------------------------
   Type a last name and the full name fills in. Where a last name is shared, the
   options are listed instead of one being picked for you. */
const PLAYERS = [];
Object.keys(BY_TEAM).forEach(club => BY_TEAM[club].forEach(n => PLAYERS.push(n)));

const lastOf = n => { const p = normName(n).split(" "); return p[p.length-1]; };
const LAST_INDEX = {};
PLAYERS.forEach(n => { const l = lastOf(n); (LAST_INDEX[l] = LAST_INDEX[l] || []).push(n); });

/* exact last name first, then last names that start with it, then full names */
function matchPlayers(text, cap){
  const q = normName(text);
  if(!q) return [];
  const seen = {}, out = [];
  const push = n => { const k = normName(n); if(!seen[k]){ seen[k] = 1; out.push(n); } };
  (LAST_INDEX[q] || []).forEach(push);
  Object.keys(LAST_INDEX).forEach(l => { if(l !== q && l.indexOf(q) === 0) LAST_INDEX[l].forEach(push); });
  PLAYERS.forEach(n => { if(normName(n).indexOf(q) === 0) push(n); });
  PLAYERS.forEach(n => { if(normName(n).indexOf(q) > 0) push(n); });
  return out.slice(0, cap || 8);
}
/* one unambiguous last name expands on its own when the leg is submitted */
function expandPlayer(text){
  const q = normName(text);
  if(!q) return text;
  if(PLAYERS.some(n => normName(n) === q)) return text;      // already a full name
  const exact = LAST_INDEX[q] || [];
  if(exact.length === 1) return exact[0];
  const starts = PLAYERS.filter(n => normName(n).indexOf(q) === 0);
  if(starts.length === 1) return starts[0];
  return text;
}

/* trace a dark keyline around whatever is drawn, the way the portraits are outlined */
function outlineGrid(rows, ch){
  const h=rows.length, w=rows[0].length;
  const g=rows.map(r=>r.split(""));
  const out=g.map(r=>r.slice());
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    if(g[y][x] !== ".") continue;
    if((y>0 && g[y-1][x] !== ".") || (y<h-1 && g[y+1][x] !== ".") ||
       (x>0 && g[y][x-1] !== ".") || (x<w-1 && g[y][x+1] !== ".")) out[y][x] = ch;
  }
  return out.map(r=>r.join(""));
}

   Redrawn with the outline-and-shade approach those old handheld sprites use:
   a dark keyline around the whole figure, a shadow tone down one side of the face
   and across the bottom of the jersey, and eyes built from a white, a pupil and a
   highlight rather than a solid block. */
const OUTL = "#1B2130", EYE = "#10151F", WHITE = "#F6F8FA", GLINT = "#FFFFFF",
      MOUTH = "#7E3B33", HAIRC = "#33261A", HAIRL = "#4C3A27", SHADE_D = "#1A2430";
const SKINS = ["#F4D2AC","#E0AE74","#B8834F","#8E5C33","#5F3C21"];

/* darken any color so shading follows whatever palette is in play */
function shade(hex, f){
  const n = parseInt(hex.slice(1), 16);
  const r = Math.round(((n >> 16) & 255) * f), g = Math.round(((n >> 8) & 255) * f), b = Math.round((n & 255) * f);
  return "#" + [r,g,b].map(v => Math.max(0, Math.min(255, v)).toString(16).padStart(2,"0")).join("");
}

/* weighted so most people start with visible eyes; shades is 1 in 8, not 1 in 4 */
const FACE_WEIGHTS = [0,1,3,0,1,3,0,2];
function defaultLook(name){
  return {hat: hashIdx(name+"|h",6), face: FACE_WEIGHTS[hashIdx(name+"|f",8)],
          pal: hashIdx(name,8), skin: 2};
}
function lookOf(m){
  const d = defaultLook(m.name||""), l = m.look||{};
  return {hat:Number.isInteger(l.hat)?l.hat:d.hat, face:Number.isInteger(l.face)?l.face:d.face,
          pal:Number.isInteger(l.pal)?l.pal:d.pal, skin:Number.isInteger(l.skin)?l.skin:d.skin};
}
function avatarSVG(look, px){
  const g = BUST24.map(r => r.split(""));
  const lay = rows => rows.forEach((r,y) => r.split("").forEach((c,x) => { if(c !== ".") g[y][x] = c; }));
  lay(FACES24[look.face % 4]);
  lay(HATS24[look.hat % 6]);
  const pal = PALETTES[look.pal % 8], hairish = look.hat >= 3;
  const skin = SKINS[look.skin % 5];
  return gridSVG(g.map(r => r.join("")), {
    O: OUTL, S: skin, K: shade(skin, .82),
    J: pal.j, V: shade(pal.j, .78), T: pal.t,
    H: hairish ? HAIRC : pal.h, L: hairish ? HAIRL : shade(pal.h, 1.25),
    F: "#D9DEE5", W: WHITE, E: EYE, G: GLINT, D: SHADE_D, B: HAIRC, M: MOUTH
  }, px, "sprite");
}

function hashIdx(s,n){let h=0;s=String(s||"");for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h%n;}
function poseFor(stat){
  const s=String(stat||"").toLowerCase();
  if(/kick|field goal|extra point/.test(s))return"k";
  if(/tackle|sack|interception rec|defen/.test(s))return"def";
  if(/pass|complet|attempt.*pass|interceptions thrown/.test(s))return"qb";
  if(/rush|carr/.test(s))return"rb";

function gridSVG(rows,colors,px,cls){
  let out="",w=rows[0].length;
  for(let y=0;y<rows.length;y++){
    let x=0;
    while(x<w){
      const c=rows[y][x];
      if(c==="."){x++;continue;}
      let run=1; while(x+run<w&&rows[y][x+run]===c)run++;
      out+='<rect x="'+x+'" y="'+y+'" width="'+run+'" height="1" fill="'+colors[c]+'"/>';
      x+=run;
    }
  }
  const scale = Math.max(1, Math.round(px / w));   /* whole pixels only */
  px = scale * w;
  return '<svg class="'+cls+'" width="'+px+'" height="'+px+'" viewBox="0 0 '+w+' '+rows.length
    +'" shape-rendering="crispEdges" aria-hidden="true">'+out+'</svg>';
}

  }, px, "sprite" + (dim ? " dim" : ""));
}

/* These are running totals, so they level up as the number climbs instead of
   being earned over and over: bronze, silver and gold at these marks. */
const LEVELS = {
  heater:     {at:[3,5,8],  unit:"hits in a row"},
  freeze:     {at:[3,5,8],  unit:"misses in a row"},
  specialist: {at:[3,6,10], unit:"hits at one position"},

const TIER_KEYS = ["bronze","silver","gold"];
/* where one member stands on one badge, whichever way it levels */
function levelStanding(k, v, on, team){
  const at = LEVELS[k].at, i = v >= at[2] ? 2 : v >= at[1] ? 1 : v >= at[0] ? 0 : -1;
  const nx = i < 2 ? TIER_KEYS[i + 1] : null;
  return {tier:i < 0 ? null : TIER_KEYS[i], rank:i + 1, value:v, chip:"", level:true, on:on || "", team:team || "", nx:i < 0 ? null : nx,
          need:nx ? at[i + 1] : null, left:nx ? at[i + 1] - v : 0, pct:nx ? v / at[i + 1] : 1};
}
/* Ride or die, Old reliable and Fool me twice belong to one NFL player each, so a
   member can hold a gold Ride or die on one guy and a bronze one on another. */
const PER_PLAYER = {rideordie:true, oldreliable:true, foolme:true};
const JERSEY = {oldreliable:true, foolme:true};       /* drawn in that player's team colors */
function standingOn(r, k, pk){
  const e = r && r.on && r.on[k] && r.on[k][pk];
  return levelStanding(k, e ? e.value : 0, e ? e.name : "", e ? e.team : "");
}
/* every medal one member holds, best first */
function medalsOf(r){
  const out = [];
  Object.keys(r.badges).forEach(k => {
    if(PER_PLAYER[k]) Object.keys((r.on && r.on[k]) || {}).forEach(pk => { const st = standingOn(r, k, pk); if(st.tier) out.push({k:k, pk:pk, st:st}); });
    else out.push({k:k, pk:null, st:standing(r, k)});
  });
  return out.sort((a, b) => b.st.rank - a.st.rank || b.st.value - a.st.value);
}
const lastName = n => { const w = String(n || "").trim().split(/\s+/); return w.length > 1 ? w.slice(1).join(" ") : w[0] || ""; };
function standing(r, k){
  if(LEVELS[k]) return levelStanding(k, (r && r.level && r.level[k]) || 0, (r && r.levelOn && r.levelOn[k]) || "");
  const n = (r && r.badges && r.badges[k]) || 0, t = n ? tierOf(n) : null, nx = n ? nextTier(n) : null;
  return {tier:t, rank:t ? TIER_KEYS.indexOf(t) + 1 : 0, value:n, chip:n > 1 ? "x" + n : "", nx:nx,
          need:nx ? TIERS[nx].at : null, left:nx ? TIERS[nx].at - n : 0, pct:nx ? n / TIERS[nx].at : 1};
}

/* ---------- storage layer, Cloudflare Pages Functions plus D1 -----------------
   Shared documents live in D1 behind /api/kv, with a version on every write so two
   people saving at the same second cannot overwrite each other. Which member you are
   is kept on your own device. */
const API = "/api/kv";
let STORE_MODE = "unknown";   /* live | memory */
let STORE_WHY = "";
const VERSIONS = {};
const MEM = {};
const errText = e => String((e && (e.message || e)) || "unknown error").slice(0, 140);
const poolKey = () => { try { return localStorage.getItem("ff:poolkey") || ""; } catch(e){ return ""; } };

async function initStorage(){
  try{
    const r = await fetch(API + "?key=ff:health", {cache:"no-store"});
    const body = await r.text();

    /* A healthy route returns JSON. If a page comes back instead, Pages served the
       site for /api/kv, which means the functions folder never deployed. Say that,
       rather than letting a JSON parse error surface. */
    let data = null;
    try{ data = JSON.parse(body); }catch(e){ data = null; }

    if(data === null){
      STORE_MODE = "memory";
      STORE_WHY = r.status === 404
        ? "There is no /api/kv route on this site, so the functions folder did not deploy."
        : "/api/kv returned a web page instead of data, so the functions folder did not deploy.";
      return;
    }
    if(r.ok && typeof data === "object" && "version" in data){
      STORE_MODE = "live"; STORE_WHY = ""; return;
    }
    STORE_MODE = "memory";
    STORE_WHY = "The server answered " + r.status
      + (data && data.error ? ": " + data.error : ".")
      + (data && data.error && /binding/i.test(data.error) ? " Add the D1 binding named DB, then redeploy." : "");
  }catch(e){
    STORE_MODE = "memory";
    STORE_WHY = "Could not reach /api/kv. " + errText(e) + ".";
  }
}

async function sget(key, shared){
  if(!shared){
    try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }catch(e){ return null; }
  }
  if(STORE_MODE === "memory"){
    const v = MEM[key];
    return v === undefined ? null : JSON.parse(v);
  }
  try{
    const r = await fetch(API + "?key=" + encodeURIComponent(key), {cache:"no-store"});
    if(!r.ok) throw new Error("server said " + r.status);
    const d = await r.json();
    VERSIONS[key] = d.version || 0;
    return d.value === null || d.value === undefined ? null : JSON.parse(d.value);
  }catch(e){
    STORE_MODE = "memory"; STORE_WHY = "Lost the server: " + errText(e);
    return null;
  }
}

/* returns {ok} or {conflict:true, value, version} */
async function sput(key, val, shared){
  const s = JSON.stringify(val);
  if(!shared){ try{ localStorage.setItem(key, s); }catch(e){} return {ok:true}; }
  if(STORE_MODE === "memory"){ MEM[key] = s; return {ok:true}; }
  const headers = {"content-type":"application/json"};
  const pk = poolKey(); if(pk) headers["x-pool-key"] = pk;
  const r = await fetch(API, {method:"PUT", headers:headers,
    body: JSON.stringify({key:key, value:s, ifVersion: VERSIONS[key] || 0})});
  if(r.ok){ const d = await r.json(); VERSIONS[key] = d.version; return {ok:true}; }
  if(r.status === 409){
    const d = await r.json();
    VERSIONS[key] = d.version;
    return {conflict:true, value: d.value ? JSON.parse(d.value) : null};
  }
  const d = await r.json().catch(()=>({}));
  throw new Error(d.error || ("server said " + r.status));
}
async function sset(key, val, shared){
  const res = await sput(key, val, shared);
  if(res.conflict) throw new Error("someone else set this up a second before you did, reload the page");
  return true;
}

/* read, apply the change, write. On a clash, re-read and re-apply, so the duplicate
   player check always runs against what is actually on the server. */
async function casUpdate(key, seed, mutate){
  for(let attempt = 0; attempt < 6; attempt++){
    let cur = await sget(key, true);
    if(cur === null) cur = seed();
    if(key === SEASON_KEY && !cur.moments) cur.moments = [];
    mutate(cur);
    const res = await sput(key, cur, true);
    if(res.ok) return cur;
  }
  throw new Error("too many people saving at once, try that again");
}

async function hash(pin){

/* Roughly how much each stat swings from game to game, so a half-yard miss on a
   79.5 line and a half-touchdown miss on 2.5 stop counting the same. These are my
   estimates, not measured from your results, and they are tunable once you have a
   season of grades to check them against. */
/* How much each stat moves from game to game, measured from five regular seasons of
   real NFL box scores (2021 to 2025, nflverse). For each stat: every player-season
   with 6+ games, that player's own game-to-game standard deviation, pooled across
   players at the same level. Higher-volume players swing more, so each stat has a
   curve,  spread = a * line^b,  fitted against the player's median game, because a
   PrizePicks line sits at the median. The line is held inside the range the curve
   was measured on [lo, hi] so it never extrapolates. Passing stats use only games
   where the QB was his team's main passer. Checked on a held-out season: fitted on
   2021 to 2024, the curves predicted 2025's actual variation within 7% for every
   stat but longest rush. Method and data: analysis/spreads in the repo.

   Stat names are typed by hand ("Rec yards", "Passing yards", "Anytime Tud"), so they
   are folded to one spelling first and matched in order, combined props first. */
const statNorm = s => String(s || "").toLowerCase()
  .replace(/%/g, " pct ").replace(/percent(age)?/g, " pct ")
  .replace(/\btuds?\b/g, "td").replace(/\btouchdowns?\b/g, "td").replace(/\btds\b/g, "td")
  .replace(/yds/g, "yards").replace(/receiving/g, "rec").replace(/receptions?/g, "receptions")
  .replace(/\brecs\b/g, "receptions")
  .replace(/rushing/g, "rush").replace(/passing/g, "pass")
  .replace(/&/g, "+").replace(/\band\b/g, "+")
  .replace(/[^a-z+]+/g, " ").replace(/\s*\+\s*/g, "+").replace(/\s+/g, " ").trim();
/*  [pattern, a, b, lo, hi]  */
const SPREADS = [
  [/^pass\+rush\+rec\s*td/, 0.935968, 0.35279, 0.80, 2.56],   // Pass+rush+rec TDs, 187 player-seasons
  [/^rush\+rec\s*td/, 0.960507, 0.47486, 0.16, 0.88],   // Anytime TD / Rush+rec TDs, 976 player-seasons
  [/any\s*time\s*td|^any\s*td|td\s*scorer|^(total\s*)?td/, 0.960507, 0.47486, 0.16, 0.88],   // Anytime TD / Rush+rec TDs, 976 player-seasons

function spreadFor(stat, line){
  const s = statNorm(stat), l = Math.abs(num(line) || 0);
  for(const [re, a, b, lo, hi] of SPREADS)
    if(re.test(s)) return a * Math.pow(Math.min(Math.max(l, lo), hi), b);
  return Math.max(0.5, l * 0.35);              /* a stat nobody has measured: a third of its line */
}
/* Pick quality: every graded leg scores how far it beat or missed its line, in
   swings, capped at two either way so one blowout cannot carry a season. The
   average maps to 0 to 100, where 50 means legs land right on the line on
   average. A leg graded without a final number counts as a modest hit or miss. */
function legQuality(p){
  if(p.result !== "H" && p.result !== "M") return null;
  const mg = margin(p);
  const sw = mg === null ? 0.5 : Math.abs(mg) / spreadFor(p.stat, p.line);
  return Math.max(-2, Math.min(2, p.result === "H" ? sw : -sw));
}
const qualityOf = r => r.qual && r.qual.length ? Math.round(50 + 25 * avg(r.qual)) : null;
const q1 = v => v === null ? "-" : String(v);
const sw1 = v => v === null ? "-" : (Math.round(v*100)/100).toFixed(2);

/* every graded leg for one member, newest first */
function legsFor(id, kind){
  const out = [];
  for(let w = DEADLINES.length - 1; w >= 0; w--){
    if(!isLocked(w)) continue;
    const p = (picksOf(w) || {})[id];
    if(!p || !p.result) continue;
    if(kind === "H" && p.result !== "H") continue;
    if(kind === "M" && p.result !== "M") continue;
    const mg = margin(p), off = mg === null ? null : Math.abs(mg);
    const l = Math.abs(num(p.line) || 0);
    out.push({w:w, p:p, off:off,
      pct: (off !== null && l > 0) ? (off/l)*100 : null,
      swing: off === null ? null : off / spreadFor(p.stat, p.line)});
  }
  return out;
}

  gold:   {at:5, name:"Gold",   shape:"rosette",F:"#4A3405", E:"#B07A08", N:"#D99A14", M:"#F0B429", H:"#FFE08A", G:"#FFF6D6", T:"#FFE08A"}

const LOCKED = {shape:"coin", F:"#30425A", E:"#24344A", N:"#14202D", M:"#17232F", H:"#101A25", G:"#17232F", icon:"#33475F", fill:"#22344A"};
const tierOf = n => n >= TIERS.gold.at ? "gold" : n >= TIERS.silver.at ? "silver" : "bronze";
const nextTier = n => n < TIERS.silver.at ? "silver" : n < TIERS.gold.at ? "gold" : null;

const BF = 30, BC = 14.5;
const FRAME_SHAPES = {
  coin:   (x, y) => (x + .5 - 15) ** 2 + (y + .5 - 15) ** 2 <= 13.4 ** 2,
  shield: (x, y) => {
    if(y < 1 || y > 28 || x < 2 || x > 27) return false;
    if(y === 1 && (x < 4 || x > 25)) return false;
    if(y === 2 && (x < 3 || x > 26)) return false;
    if(y <= 15) return true;
    const t = (y - 15) / 13.5;
    return Math.abs(x + .5 - 15) <= 13 * (1 - Math.pow(t, 1.7)) + .2;
  },
  rosette:(x, y) => {
    const dx = x + .5 - 15, dy = y + .5 - 12.6, a = Math.atan2(dy, dx);
    return Math.hypot(dx, dy) <= 10.5 + 2.3 * Math.pow(.5 + .5 * Math.cos(12 * a), 2);
  }
};
/* the two ribbon tails that hang below the gold rosette */
function ribbonAt(x, y){
  if(y < 17 || y > 29) return null;
  const k = Math.floor((y - 17) / 4), L0 = 7 - k, R0 = 18 + k;     /* tails lean outward */
  const notch = x0 => (y >= 28 && x === x0 + 2) || (y === 29 && (x === x0 + 1 || x === x0 + 3));
  if(x >= L0 && x <= L0 + 4 && !notch(L0)) return "L";
  if(x >= R0 && x <= R0 + 4 && !notch(R0)) return "R";
  return null;
}
const ICON_CENTER = {coin:[15, 15], shield:[15, 13.5], rosette:[15, 12.6]};
const iconBox = {};
function boxOf(key){
  if(iconBox[key]) return iconBox[key];
  const rows = ICONS[key]; let x0 = 99, y0 = 99, x1 = -1, y1 = -1;
  rows.forEach((r, y) => [...r].forEach((c, x) => { if(c !== "."){ x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); } }));
  return iconBox[key] = {x0, y0, x1, y1};
}
const badgeCache = {};
const shadeHex = (h, f) => "#" + [1, 3, 5].map(i => Math.round(parseInt(h.slice(i, i + 2), 16) * f).toString(16).padStart(2, "0")).join("");
function badgeGrid(key, tier, team){
  const club = JERSEY[key] && team ? teamOf(team) : null;
  const ck = key + "|" + tier + "|" + (club ? club.k : "");
  if(badgeCache[ck]) return badgeCache[ck];
  const T = tier === "locked" ? LOCKED : TIERS[tier], shapeName = T.shape, shape = FRAME_SHAPES[shapeName];
  const ins = (x, y) => x >= 0 && y >= 0 && x < BF && y < BF && shape(x, y);
  const rib = (x, y) => shapeName === "rosette" && x >= 0 && y >= 0 && x < BF && y < BF && !ins(x, y) ? ribbonAt(x, y) : null;
  const solid = (x, y) => ins(x, y) || !!rib(x, y);
  const g = [];
  for(let y = 0; y < BF; y++){ g.push([]); for(let x = 0; x < BF; x++){
    let c = null;
    if(ins(x, y)){
      const edge = !ins(x-1,y) || !ins(x+1,y) || !ins(x,y-1) || !ins(x,y+1);
      const rim  = !edge && (!ins(x-2,y) || !ins(x+2,y) || !ins(x,y-2) || !ins(x,y+2));
      const deep = !edge && !rim && (!ins(x-3,y) || !ins(x+3,y) || !ins(x,y-3) || !ins(x,y+3));
      const lean = (BC - x) + (BC - y);           /* positive toward the top left */
      if(edge) c = T.F;
      else if(rim) c = lean > 3 ? T.H : lean < -3 ? T.E : T.M;
      else if(deep && lean < -6) c = T.N;
      else c = T.M;
    } else if(rib(x, y)){
      const side = rib(x, y), r = (x2, y2) => !!rib(x2, y2) || ins(x2, y2);
      const edge = !r(x-1,y) || !r(x+1,y) || !r(x,y+1);
      const k = Math.floor((y - 17) / 4), x0 = side === "L" ? 7 - k : 18 + k;
      c = edge ? "#4A1410" : x === x0 + 1 ? "#F07A70" : x === x0 + 3 ? "#A32D25" : "#D4433A";
    } else if(solid(x-1, y-1)) c = "#080F17";   /* hard drop shadow, like the rest of the app */
    g[y].push(c);
  }}
  /* a small glint on the upper left of the metal */
  if(tier !== "locked"){
    const gl = shapeName === "shield" ? [[5,4],[4,5],[4,6]] : shapeName === "rosette" ? [[9,5],[8,6],[7,7]] : [[8,5],[6,6],[5,8]];
    gl.forEach(([x, y]) => { if(g[y][x] === T.M || g[y][x] === T.H) g[y][x] = T.G; });
  }
  /* the symbol, centred on the frame, with a one pixel emboss shadow under it */
  const b = boxOf(key), [cx, cy] = ICON_CENTER[shapeName];
  const ox = Math.round(cx - (b.x0 + b.x1 + 1) / 2), oy = Math.round(cy - (b.y0 + b.y1 + 1) / 2);
  const rows = ICONS[key], at = (x, y) => { const r = rows[y - oy]; return r ? r[x - ox] : undefined; };
  for(let y = 0; y < BF; y++) for(let x = 0; x < BF; x++){
    const ch = at(x, y);
    if(ch && ch !== "."){ g[y][x] = tier === "locked" ? (ch === "O" ? LOCKED.icon : LOCKED.fill) : (club ? clubColor(ch, club) : BPAL[ch]); continue; }
    const up = at(x - 1, y - 1);
    if(up && up !== "." && ins(x, y) && tier !== "locked") g[y][x] = T.E;
  }
  return badgeCache[ck] = g;
}
/* a jersey in a club's colors: body in the home color, collar in the trim, marks stay white */
function clubColor(ch, club){
  if(ch === "g" || ch === "r") return club.j;
  if(ch === "G" || ch === "R") return shadeHex(club.j, .62);
  if(ch === "u") return club.t;
  return BPAL[ch];
}
function badgeSVG(key, count, px, locked, team){
  if(!ICONS[key]) return "";
  const g = badgeGrid(key, locked ? "locked" : (typeof count === "string" ? count : tierOf(count)), team);
  let out = "";
  for(let y = 0; y < BF; y++){ let x = 0;
    while(x < BF){ const c = g[y][x]; if(!c){ x++; continue; }
      let run = 1; while(x + run < BF && g[y][x + run] === c) run++;
      out += '<rect x="' + x + '" y="' + y + '" width="' + run + '" height="1" fill="' + c + '"/>'; x += run; } }
  const scale = Math.max(1, Math.round(px / BF)); px = scale * BF;
  return '<svg class="sprite badgeicon" width="' + px + '" height="' + px + '" viewBox="0 0 ' + BF + ' ' + BF
    + '" shape-rendering="crispEdges" aria-hidden="true">' + out + '</svg>';
}
/* one medal with its name, tier, and how far it is from the next tier */
function medalTap(k, who, earned, pk){
  const tip = BADGES[k].name + ": " + (earned && earned.length
    ? earned.map(e => "WK" + (e.w + 1) + " " + (e.p ? e.p.player + ", " : "") + (e.tier && LEVELS[k] ? TIERS[e.tier].name + ", " : "") + e.why).join("\n")
    : BADGES[k].desc + (who ? " (not earned yet)" : ""));
  return ' data-badge="' + k + '"' + (who ? ' data-who="' + esc(who) + '"' : '') + (pk ? ' data-on="' + esc(pk) + '"' : '')

/* Shrink with a canvas, and fall back to sending the file as it is if that fails */
function shrinkImage(file, maxSide){
  return new Promise((resolve, reject) => {
    let settled = false;
    const done = v => { if(!settled){ settled = true; resolve(v); } };
    const fail = e => { if(!settled){ settled = true; reject(e); } };
    const timer = setTimeout(() => fail(new Error("the image took too long to open")), 15000);
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      clearTimeout(timer);
      try{
        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(img.width * scale));
        c.height = Math.max(1, Math.round(img.height * scale));
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        const data = c.toDataURL("image/jpeg", 0.85);
        URL.revokeObjectURL(url);
        if(!data || data.length < 100) return fail(new Error("the shrunken image came out empty"));
        done({ b64: data.split(",")[1], mediaType: "image/jpeg", w: c.width, h: c.height });
      }catch(e){ URL.revokeObjectURL(url); fail(e); }
    };
    img.onerror = () => { clearTimeout(timer); URL.revokeObjectURL(url); fail(new Error("could not open that image")); };
    img.src = url;
  });
}
/* the plain path: no canvas, just the bytes */
function rawImage(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => { const s = String(r.result || ""); const i = s.indexOf(",");
      resolve({ b64: s.slice(i + 1), mediaType: file.type || "image/jpeg", w:0, h:0 }); };
    r.onerror = () => reject(new Error("could not read that file"));
    r.readAsDataURL(file);
  });
}

async function readSlip(file){
 try{
  const kb = Math.round((file.size || 0) / 1024);
  slipStep("Opening the screenshot", (file.name || "image") + ", " + kb + " KB");
  let img = null;
  try{
    img = await shrinkImage(file, 1568);
    slipStep("Sending it to be read", img.w + " by " + img.h);
  }catch(e){
    try{
      slipStep("Could not shrink it, sending the original", e.message || String(e));
      img = await rawImage(file);
      if(img.b64.length * 0.75 > 5 * 1024 * 1024){
        slipFail("That screenshot is too big to send (" + kb + " KB) and it could not be shrunk. Crop it and try again."); return;
      }
    }catch(e2){
      slipFail("Could not read that file: " + (e2.message || e2)); return;
    }
  }

  let out, r;
  try{
    r = await fetch("/api/slip", { method:"POST", headers:{"content-type":"application/json"},
      body: JSON.stringify({ image: img.b64, mediaType: img.mediaType }) });
  }catch(e){
    slipFail("Could not reach the server: " + (e.message || e)); return;
  }
  const body = await r.text();
  try{ out = JSON.parse(body); }
  catch(e){
    slipFail("The server did not send back a lineup. It replied with "
      + r.status + " and " + (body.slice(0,80) || "nothing") + ". If that looks like a web page, the reader is not deployed."); return;
  }
  if(!r.ok || out.error){
    slipFail(out.error || ("the reader said " + r.status)); return;
  }

  const picks = picksOf(state.view), members = state.roster.members;
  const rows = (out.legs || []).map(L => {
    let owner = null;
    for(const m of members){
      const p = picks[m.id];
      if(p && normName(p.player) === normName(L.player)){ owner = m.id; break; }
    }
    if(!owner){
      const last = normName(L.player).split(" ").pop();
      const hits = members.filter(m => picks[m.id] && normName(picks[m.id].player).split(" ").pop() === last);
      if(hits.length === 1) owner = hits[0].id;
    }
    return Object.assign({}, L, { owner: owner, use: !!owner });
  });
  slipSay("Read a screenshot");
  state.slip = { busy:false, error:null, legs:rows, note: out.note || "",
                 read: (out.legs || []).length };
  render();
 }catch(err){
  /* nothing gets to fail quietly */
  slipFail("Something went wrong reading that: " + (err && err.message ? err.message : String(err)));
 }
}

async function applySlip(){
  const S = state.slip;
  if(!S || !S.legs) return;
  const chosen = S.legs.filter(L => L.use && L.owner);
  if(!chosen.length){ state.slip = null; render(); return; }
  const w = state.view;
  try{
    await updateSeason(s => {
      const wk = s.weeks[w] || (s.weeks[w] = {picks:{}});
      for(const L of chosen){
        const p = wk.picks[L.owner];
        if(!p) continue;
        p.flavor = L.flavor;
        if(L.line !== null) p.line = String(L.line);
        if(L.side) p.side = L.side;
        if(L.final !== null) p.actual = L.final;
        if(L.result) p.result = L.result;
        else if(L.final !== null) p.result = grade(p, L.final);
        p.fromSlip = true;
      }
    });
    state.msg = chosen.length + (chosen.length === 1 ? " leg updated." : " legs updated.");
  }catch(e){ state.err = "Could not save: " + errText(e); }
  state.slip = null;
  render();
}

/* ---- live numbers during games, from the Worker's ESPN feed ----------------
   Unofficial. The commissioner's entered final is still what grades a leg. */
const LIVE_KEY = "ff:live";
async function loadLive(force, week){
  if(STORE_MODE !== "live") return;
  const w = week === undefined ? state.view : week;
  try{
    const r = await fetch("/api/live?week=" + w + (force ? "&refresh=1" : ""), {cache:"no-store"});
    if(!r.ok) return;
    const doc = await r.json();
    if(doc && doc.legs){
      state.liveByWeek = state.liveByWeek || {};
      state.liveByWeek[w] = doc;
      if(w === state.view) state.live = doc;
    }
  }catch(e){}
}
function wantLive(){ if(isLocked(state.view) && !liveDoc(state.view)) loadLive(false).then(render); }
const liveDoc = w => (state.liveByWeek && state.liveByWeek[w]) || null;
const liveFor = (w, id) => { const d = liveDoc(w); return d && d.legs ? d.legs[id] : null; };
const liveAge = () => { const d = liveDoc(state.view); return d && d.updated ? Date.now() - d.updated : null; };
function liveAgeText(){
  const a = liveAge(); if(a === null) return "";
  const m = Math.floor(a / 60000);
  return m < 1 ? "just now" : m === 1 ? "1 min ago" : m < 60 ? m + " min ago" : Math.floor(m/60) + "h ago";
}
/* how a leg is doing right now: needs, cleared, or on the number */
function liveStatus(p, L){
  if(!L || L.value === null || L.value === undefined) return null;
  const line = num(p.line); if(line === null) return null;
  const v = L.value, more = (p.side || "More") === "More";
  const final = L.state === "post";
  const good = more ? v > line : v < line;
  const push = v === line;
  const gap = trim1(Math.abs(v - line));

  /* once the game is over it either hit or missed, so stop saying "needs" */
  let text;
  if(push) text = final ? "landed on the number" : "sitting on the number";
  else if(final) text = good ? "hit by " + gap : "missed by " + gap;
  else if(more) text = good ? "cleared by " + gap : "needs " + gap + " more";
  else          text = good ? "under by " + gap : "over by " + gap;

  const pct = final && !good ? 100 : Math.max(0, Math.min(100, Math.round(v / line * 100)));
  const tone = push ? "#8FA3B8" : good ? "#4CC17E" : (final ? "#E2574C" : "#FFC53D");
  return { v, final, cleared: good, push, text, pct, tone };
}
function liveClock(L){
  if(!L) return "";
  if(L.state === "pre") return "not started";
  if(L.state === "post") return "final";
  if(L.state === "in") return "Q" + (L.period || "?") + " " + (L.clock || "");
  if(L.state === "off") return L.note || "no game";
  return "";
}

/* margin statistics: hit rate, and how far the average leg lands from its line */
const avg = a => a.length ? a.reduce((x,y) => x+y, 0) / a.length : null;
const pct1 = v => v === null ? "-" : (Math.round(v*10)/10) + "%";
const num1 = v => v === null ? "-" : String(Math.round(v*10)/10);
const hitRate = r => (r.H + r.M) ? (r.H / (r.H + r.M)) * 100 : null;

/* ---------- records, badges and moments, all derived from the grades ---------- */
function analyze(){
  const members = state.roster.members;
  const rec = {}; members.forEach(m => rec[m.id] = {id:m.id, name:m.name, H:0, M:0, V:0, skip:0,
    badges:{}, earned:{}, level:{}, levelOn:{}, on:{}, cur:0, best:0, hitPct:[], missPct:[], hitAbs:[], missAbs:[], hitSw:[], missSw:[], qual:[]});
  const moments = [];
  /* running season counts behind Homer, Ride or die and Specialist */
  const teamN = {}, playerN = {}, posHits = {}, hitsOn = {}, missesOn = {};
  members.forEach(m => { teamN[m.id] = {}; playerN[m.id] = {}; posHits[m.id] = {}; hitsOn[m.id] = {}; missesOn[m.id] = {}; });
  /* detail is the Moments line; p and why are what the badge panel shows when you tap a medal */
  const give = (id, key, w, detail, p, why, tier) => {
    rec[id].badges[key] = (rec[id].badges[key]||0) + 1;
    (rec[id].earned[key] = rec[id].earned[key] || []).push({w:w, detail:detail, p:p || null, why:why || detail, tier:tier || null});
    moments.push({w:w, who:rec[id].name, label:BADGES[key].name + (tier ? ", " + tier : ""), detail:detail});
  };
  /* a level badge moves up only when a new season best lands on one of its marks */
  const climb = (id, key, w, value, detail, p, why, on) => {
    const r = rec[id];
    if(value <= (r.level[key] || 0)) return;
    r.level[key] = value; r.levelOn[key] = on || "";
    const i = LEVELS[key].at.indexOf(value);
    if(i >= 0) give(id, key, w, detail, p, why, TIER_KEYS[i]);
  };
  /* the same, but kept separately for each NFL player */
  const climbOn = (id, key, w, pk, p, value, detail, why) => {
    const r = rec[id], bag = r.on[key] = r.on[key] || {};
    const e = bag[pk] = bag[pk] || {value:0, name:p.player, team:"", legs:[]};
    e.name = p.player; if(p.team) e.team = String(p.team).toUpperCase();
    if(value <= e.value) return;
    e.value = value;
    if(value > (r.level[key] || 0)){ r.level[key] = value; r.levelOn[key] = p.player; }
    const i = LEVELS[key].at.indexOf(value), tier = i >= 0 ? TIER_KEYS[i] : null;
    e.legs.push({w:w, p:p, why:why, tier:tier});
    if(tier){ give(id, key, w, detail, p, why, tier); const L = r.earned[key]; L[L.length - 1].on = pk; }
  };

  for(let w=0; w<DEADLINES.length; w++){
    if(!isLocked(w)) continue;
    const picks = picksOf(w);
    if(!Object.keys(picks).length) continue;
    const hits = [], misses = [];
    /* Cooler, Backbone and Perfect card describe the whole card, so they wait until
       every leg posted that week has a grade. Otherwise 3 hits and 1 miss with two
       games still to play would hand out a Cooler early. */
    const cardDone = Object.keys(picks).every(id => !!picks[id].result);
    const weekSw = [];   /* every graded leg's margin in swings, for Leg of the week and Brick */

    members.forEach(m => {
      const r = rec[m.id], p = picks[m.id];
      if(!p){ r.skip++; r.cur = 0; give(m.id,"ghost",w,"No leg in before the lock"); return; }
      const leg = p.player + " " + p.side + " " + p.line + " " + p.stat;
      const mg = margin(p);
      const prevCur = r.cur;

      /* how far off the line it landed, in raw units and as a share of the line */
      const lineAbs = Math.abs(num(p.line) || 0);
      const off = mg === null ? null : Math.abs(mg);
      const offPct = (off !== null && lineAbs > 0) ? (off / lineAbs) * 100 : null;

      const swing = off === null ? null : off / spreadFor(p.stat, p.line);
      const lq = legQuality(p); if(lq !== null) r.qual.push(lq);

      if(p.result === "H"){ r.H++; hits.push(m.id); r.cur = r.cur > 0 ? r.cur+1 : 1;
        if(off !== null) r.hitAbs.push(off);
        if(offPct !== null) r.hitPct.push(offPct);
        if(swing !== null) r.hitSw.push(swing); }
      else if(p.result === "M"){ r.M++; misses.push(m.id); r.cur = r.cur < 0 ? r.cur-1 : -1;
        if(off !== null) r.missAbs.push(off);
        if(offPct !== null) r.missPct.push(offPct);
        if(swing !== null) r.missSw.push(swing); }
      else if(p.result === "V"){ r.V++; }
      r.best = Math.max(r.best, r.cur);

      if(p.result === "H" && isHalf(mg)) give(m.id,"razor",w,leg+", "+marginText(p),p,"Cleared it by exactly half a point");
      if(p.result === "M" && isHalf(mg)) give(m.id,"hook",w,leg+", "+marginText(p),p,"Came up exactly half a point short");
      const l = num(p.line);
      if(mg !== null && p.result === "H" && l && Math.abs(l) > 0 && mg >= 2 && mg/Math.abs(l) >= 0.5)
        give(m.id,"cushion",w,leg+", "+marginText(p),p,"Cleared the line by " + Math.round(mg/Math.abs(l)*100) + " percent");

      const early = p.ts ? DEADLINES[w] - p.ts : null;
      if(early === null){}
      else if(early <= 900000 && early >= 0){ const mins = Math.max(1, Math.round(early/60000));
        give(m.id,"buzzer",w,"Posted "+leg+" with minutes to spare",p,"Posted " + mins + " minute" + (mins===1?"":"s") + " before the lock"); }
      else if(early >= 259200000){ const days = Math.floor(early/86400000);
        give(m.id,"earlybird",w,"Had "+leg+" in three days early",p,"Posted " + days + " days before the lock"); }

      if(p.result === "H") climb(m.id,"heater",w,r.cur,r.cur+" hits in a row",p,"Made it " + r.cur + " hits in a row");
      if(p.result === "M") climb(m.id,"freeze",w,-r.cur,(-r.cur)+" misses in a row",p,"Made it " + (-r.cur) + " misses in a row");

      /* habits across the season, counted from every leg posted */
      const team = String(p.team || "").toUpperCase();
      if(team){ const n = teamN[m.id][team] = (teamN[m.id][team] || 0) + 1;
        climb(m.id,"homer",w,n,ordinal(n) + " " + team + " leg of the season, " + p.player,p,ordinal(n) + " " + team + " leg of the season", team); }
      const pk = normName(p.player);
      if(pk){ const n = playerN[m.id][pk] = (playerN[m.id][pk] || 0) + 1;
        climbOn(m.id,"rideordie",w,pk,p,n,"Went back to " + p.player + " a " + ordinal(n).toLowerCase() + " time",ordinal(n) + " time picking him");
        if(p.result === "H"){ const h = hitsOn[m.id][pk] = (hitsOn[m.id][pk] || 0) + 1;
          climbOn(m.id,"oldreliable",w,pk,p,h,p.player + " cashed for the " + ordinal(h).toLowerCase() + " time",ordinal(h) + " hit on him"); }
        if(p.result === "M"){ const x = missesOn[m.id][pk] = (missesOn[m.id][pk] || 0) + 1;
          climbOn(m.id,"foolme",w,pk,p,x,"Burned by " + p.player + " a " + ordinal(x).toLowerCase() + " time",ordinal(x) + " miss on him"); } }

      if(p.result === "H"){
        const pos = playerPos(p.player);
        if(pos){ const n = posHits[m.id][pos] = (posHits[m.id][pos] || 0) + 1;
          climb(m.id,"specialist",w,n,ordinal(n) + " hit on a " + pos + ", " + leg,p,ordinal(n) + " hit on a " + pos + " this season", pos + "s"); }
        if(prevCur <= -2) give(m.id,"bounce",w,"Hit " + leg + " after " + (-prevCur) + " straight misses",p,"Hit after " + (-prevCur) + " straight misses");
        if(flavorOf(p) === "demon") give(m.id,"slayer",w,"Cashed a demon, " + leg + ", " + marginText(p),p,"Cashed a demon line");
        if(p.side === "Less") give(m.id,"fade",w,"Took the under and hit, " + leg,p,"Took the Less and it hit");
        if(swing !== null && mg !== null && mg > EPS && swing < 0.1)
          give(m.id,"photo",w,leg + ", " + marginText(p) + ", " + sw1(swing) + " of a swing",p,"Won by " + sw1(swing) + " of a swing");
      }
      if(swing !== null && (p.result === "H" || p.result === "M"))
        weekSw.push({id:m.id, sw:p.result === "H" ? swing : -swing, leg:leg, p:p});
    });

    /* biggest beat and biggest miss of the week, once every leg is graded */
    if(cardDone && weekSw.length){
      const hi = Math.max(...weekSw.map(x => x.sw)), lo = Math.min(...weekSw.map(x => x.sw));
      if(hi > 0) weekSw.filter(x => Math.abs(x.sw - hi) < 1e-9).forEach(x =>
        give(x.id,"legweek",w,"Best leg of the week, " + x.leg + ", " + marginText(x.p) + ", " + sw1(hi) + " swings",x.p,"Best leg that week, " + sw1(hi) + " swings over"));
      if(lo < 0) weekSw.filter(x => Math.abs(x.sw - lo) < 1e-9).forEach(x =>
        give(x.id,"brick",w,"Worst miss of the week, " + x.leg + ", " + marginText(x.p) + ", " + sw1(-lo) + " swings",x.p,"Worst miss that week, " + sw1(-lo) + " swings under"));
    }

    if(cardDone && misses.length === 1 && hits.length >= 3) give(misses[0],"cooler",w,"The only leg to miss on a "+hits.length+" hit card",picks[misses[0]],"The only miss on a card with " + hits.length + " hits");
    if(cardDone && hits.length === 1 && misses.length >= 3) give(hits[0],"backbone",w,"Carried a card that went 1 for "+(hits.length+misses.length),picks[hits[0]],"The only hit on a card that went 1 for " + (hits.length+misses.length));
    if(cardDone && misses.length === 0 && hits.length === members.length) hits.forEach(id => give(id,"perfect",w,"The card went "+hits.length+" for "+hits.length,picks[id],"The card went " + hits.length + " for " + hits.length));
  }

  (state.season.moments||[]).forEach(mo => moments.push({w:mo.week, who:mo.by, label:"Noted", detail:mo.text, manual:true, id:mo.id}));
  moments.sort((a,b) => b.w - a.w);
  const table = members.map(m => rec[m.id]).sort((a,b) => b.H-a.H || a.M-b.M || b.best-a.best);
  return {rec:rec, table:table, moments:moments};
}

async function boot(){
  await initStorage();
  const [roster, season, me] = await Promise.all([sget(ROSTER_KEY,true), sget(SEASON_KEY,true), sget(ME_KEY,false)]);
  state.roster = roster;
  state.season = season || {weeks:{}, moments:[]};
  if(!state.season.moments) state.season.moments = [];
  try{ await applyCorrections(); }catch(e){}
  state.me = me && me.id ? me.id : null;
  state.view = currentWeek();
  if(isLocked(state.view)) await loadLive(false);
  if(state.me && roster && !roster.members.some(m=>m.id===state.me)) state.me = null;
  /* once Friday 5 has passed, the card is what you want to see, not the entry form */
  state.screen = !roster ? "setup" : (isLocked(state.view) ? "card" : "main");
  render();
  document.addEventListener("click", onBadgeTap);
  document.addEventListener("keydown", onBadgeKey);
  setInterval(tickClock, 1000);
  setInterval(quietRefresh, 60000);
}
/* While the photo picker is open, or a screenshot is being read, nothing is
   allowed to re-render the card. A re-render replaces the file input, and a photo
   chosen in the picker then comes back to an element that no longer exists. The
   live feed refreshes every minute during games, which is exactly when this bit. */
function holdRenders(){
  return Date.now() < (state.pickingUntil || 0) || !!(state.slip && state.slip.busy);
}
async function quietRefresh(){
  if(!(state.screen === "card" || state.screen === "main")) return;
  if(holdRenders()) return;
  const fresh = await sget(SEASON_KEY, true);
  if(!fresh) return;
  if(!fresh.moments) fresh.moments = [];
  let changed = JSON.stringify(fresh.weeks[state.view]||{}) !== JSON.stringify(state.season.weeks[state.view]||{});
  state.season = fresh;
  if(isLocked(state.view)){
    const before = state.live ? state.live.updated : null;
    await loadLive(false);
    if(state.live && state.live.updated !== before) changed = true;
  }
  if(changed && !holdRenders()) render();   /* the card recolors itself as numbers and grades land */
}
/* Finals typed in by hand that turned out wrong. Each one only changes the leg if it
   still holds the wrong number, so it runs once and then never touches anything. */
const CORRECTIONS = [
  {week:5, player:"Brock Purdy", stat:"Fantasy Score", from:16.36, to:17.36}   /* PrizePicks had 17.36 */
];
async function applyCorrections(){
  const hits = s => CORRECTIONS.filter(c => { const ps = (s.weeks[c.week] || {}).picks || {};
    return Object.keys(ps).some(id => ps[id].player === c.player && ps[id].stat === c.stat && num(ps[id].actual) === c.from); });
  if(!state.season || !hits(state.season).length) return;
  await updateSeason(s => hits(s).forEach(c => { const ps = s.weeks[c.week].picks;
    Object.keys(ps).forEach(id => { const p = ps[id];
      if(p.player === c.player && p.stat === c.stat && num(p.actual) === c.from){ p.actual = c.to; p.result = grade(p, c.to); } }); }));
}
async function updateSeason(mutate){
  /* seed from what is already loaded, so a dropped connection cannot blank the season */
  state.season = await casUpdate(SEASON_KEY, () => state.season || {weeks:{}, moments:[]}, mutate);
}
async function updateRoster(mutate){
  state.roster = await casUpdate(ROSTER_KEY, () => state.roster, mutate);
}

const BUILD = "2026-10-25j";
/* Anything that breaks shows up on screen in words, with the build it came from.
   On a phone there is no console to look at, so an error nobody can see is the
   same as no error report at all. */
function showFault(msg){
  try{
    let bar = document.getElementById("faultbar");
    if(!bar){
      bar = document.createElement("div");
      bar.id = "faultbar";
      bar.setAttribute("role", "alert");
      bar.style.cssText = "position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:9999;"
        + "background:#E2574C;color:#150A08;border:4px solid #080F17;padding:10px 12px;font:16px/1.4 monospace;"
        + "box-shadow:5px 5px 0 #080F17;word-break:break-word";
      bar.onclick = () => bar.remove();
      document.body.appendChild(bar);
    }
    const stamp = "build " + BUILD;
    bar.textContent = msg + " (" + stamp + "). Tap to dismiss.";
  }catch(e){}
}
window.addEventListener("error", ev => showFault("Error: " + (ev.message || "unknown") + (ev.lineno ? " at line " + ev.lineno : "")));
window.addEventListener("unhandledrejection", ev => {
  const r = ev.reason; showFault("Error: " + (r && r.message ? r.message : String(r)));
});

function render(){
  const app = document.getElementById("app");
  let html, wire;
  if(state.screen === "setup"){ html = viewSetup(); wire = wireSetup; }
  else if(state.screen === "settings"){ html = viewSettings(); wire = wireSettings; }
  else if(state.screen === "season"){ html = viewSeason(); wire = wireSeason; }
  else if(state.screen === "card"){ html = viewCard(); wire = wireCard; }
  else if(state.screen === "profile"){ html = viewProfile(); wire = wireProfile; }
  else { html = viewMain(); wire = wireMain; }
  app.innerHTML = banner() + html;
  /* one missing element must never stop the rest of the screen from working */
  try{ wire(); }catch(e){
    console.error("wiring failed on " + state.screen + ":", e);
    showFault("Buttons on this screen did not connect: " + (e && e.message ? e.message : String(e)));
  }
  const retry = document.getElementById("retrystore");
  if(retry) retry.onclick = async () => {
    retry.textContent = "Checking";
    await initStorage();
    if(STORE_MODE === "live"){
      const roster = await sget(ROSTER_KEY, true), season = await sget(SEASON_KEY, true);
      if(roster) state.roster = roster;
      if(season){ if(!season.moments) season.moments = []; state.season = season; }
      if(state.roster) state.screen = isLocked(currentWeek()) ? "card" : "main";
    }
    render();
  };
}

function viewSetup(){
  return '<div class="topbar"><span class="poolname">FLEX FRIDAY</span></div>'
  + '<div class="card"><h3>Set up the lineup</h3>'
  + '<p class="hint">Do this once. Everyone else opens this page and claims their name.</p>'
  + '<label for="pn">Pool name</label><input id="pn" type="text" value="Flex Friday" maxlength="40">'
  + '<p class="hint">The first name is the commissioner. That person enters the final numbers each week, and can hand the job to someone else later.</p>'+ '<label>The six of you, in lineup order</label>'
  + [0,1,2,3,4,5].map(i=>'<input id="n'+i+'" type="text" maxlength="18" placeholder="'+(i===0?"Your name":"Friend "+i)+'" style="margin-bottom:8px">').join("")
  + '<button class="btn wide" id="go">Create the pool</button><p class="err" id="setuperr" hidden></p></div>'

function wireSetup(){
  document.getElementById("go").onclick = async () => {
    const names = [0,1,2,3,4,5].map(i=>document.getElementById("n"+i).value.trim()).filter(Boolean);
    const err = document.getElementById("setuperr");
    if(names.length < 2){ err.textContent = "Add at least two names to start."; err.hidden = false; return; }
    const roster = { pool: document.getElementById("pn").value.trim() || "Flex Friday",
      members: names.map((n,i)=>({id:"m"+i+"_"+Math.random().toString(36).slice(2,7), name:n, pinHash:null, admin:i===0})) };
    try{
      await sset(ROSTER_KEY, roster, true);
      await sset(SEASON_KEY, {weeks:{}, moments:[]}, true);
      state.roster = roster; state.season = {weeks:{}, moments:[]}; state.screen = "main"; render();
    }catch(e){ err.textContent = "Could not create the pool: " + errText(e); err.hidden = false; }
  };
}

function topbar(current){
  return '<div class="topbar"><span class="poolname">'
  + esc((current==="profile"?(state.roster.members.find(m=>m.id===state.profile)||{name:"Profile"}).name:current==="season"?"Season":current==="card"?"The card":(current==="settings"?"Settings":state.roster.pool)).toUpperCase())+'</span>'

  + (current==="main" ? '<button class="linkbtn" id="tocard">Card</button><button class="linkbtn" id="toseason">Season</button><button class="linkbtn" id="settings">Setup</button>'
                      : '<button class="linkbtn" id="back">Back</button>')
  + '</div></div>';
}

function viewMain(){
  const w = state.view, locked = isLocked(w), r = state.roster;
  const picks = picksOf(w), n = Object.keys(picks).length, size = r.members.length;
  const total = w === 0 ? 6*86400000 : DEADLINES[w]-DEADLINES[w-1];
  const pct = Math.max(0, Math.min(100, 100 - ((DEADLINES[w]-Date.now())/total*100)));
  const blocks = 16, on = Math.round(pct/100*blocks);

  return topbar("main")
  + '<div class="board"><div class="weekrow"><h2>WEEK '+(w+1)+'</h2>'
  + '<div class="weeknav"><button id="prev"'+(w===0?" disabled":"")+' aria-label="Previous week">&#9664;</button>'
  + '<button id="next"'+(w===17?" disabled":"")+' aria-label="Next week">&#9654;</button></div></div>'
  + '<div class="clock" id="clock">'+(locked ? (n+"/"+size+" IN") : esc(countdown(w)))+'</div>'
  + '<div class="clocklabel">'+(locked ? "Locked "+esc(deadlineText(w))
      : n+" of "+size+" legs in, locks "+esc(deadlineText(w)))+'</div>'
  + (locked ? "" : '<div class="fill">'+Array.from({length:blocks},(_,i)=>'<i class="'+(i<on?"on":"")+'"></i>').join("")+'</div>')
  + '</div>'
  + (state.me ? yourLegCard(w, locked) : signInCard())
  + lineupCard(w, locked)
  + buildPanel(w)
  + '<p class="footnote">Six legs, one player each, no repeats. Locks Friday at 5:00 PM Eastern. '
  + 'PrizePicks takes entries until 11:59 PM ET, so the 5:00 lock is our rule, not theirs.'
  + '<br><span class="build">build 2026-10-25j</span></p>';
}

function signInCard(){
  const c = state.claiming;
  if(c){
    const m = state.roster.members.find(x=>x.id===c), first = !m.pinHash;
    const buf = state.pinBuf || "";
    const line = first
      ? (state.pinStage === "confirm" ? "Type it again." : "Pick a 4-digit code. You will use it to post your leg from any device.")
      : "Enter your 4-digit code.";
    return '<div class="card"><h3>'+esc(m.name)+'</h3>'
    + '<p class="hint">'+line+'</p>'
    + '<div class="pindots">' + [0,1,2,3].map(i =>
        '<span class="' + (i < buf.length ? "on" : "") + '"></span>').join("") + '</div>'
    + '<div class="keypad">' + ["1","2","3","4","5","6","7","8","9","clear","0","back"].map(k => {
        const label = k === "clear" ? "C" : k === "back" ? "&#9003;" : k;
        const aria = k === "clear" ? "Clear" : k === "back" ? "Delete" : k;
        return '<button type="button" data-key="'+k+'" aria-label="'+aria+'">'+label+'</button>';
      }).join("") + '</div>'
    + '<button class="btn ghost wide" id="cancel">Back</button>'
    + (state.err ? '<p class="err">'+esc(state.err)+'</p>' : "") + '</div>';
  }
  return '<div class="card"><h3>Which one are you?</h3>'
  + '<p class="hint">Each person gets their own slot and code, so nobody can post a leg for you.</p>'
  + '<div class="whoami">'+state.roster.members.map(m=>
      '<button data-claim="'+m.id+'">'+avatarFor(m,48)+'<span>'+esc(m.name)
      +'<small>'+(m.pinHash?"sign in":"unclaimed")+'</small></span></button>').join("")
  + '</div></div>';
}

/* A prefix match let https://prizepicks.evil.com.co through, so the host is parsed
   and checked against an allowlist instead. */
const PP_HOSTS = ["prizepicks.com", "prizepicks.onelink.me"];
function isPrizePicksUrl(v){
  try{
    const u = new URL(String(v).trim());
    if(u.protocol !== "https:") return false;
    const h = u.hostname.toLowerCase();
    return PP_HOSTS.some(d => h === d || h.endsWith("." + d));
  }catch(e){ return false; }
}
/* PrizePicks has no public URL that accepts arbitrary picks, so this does the two
   things that are actually possible: walk the builder through the six legs one at a
   time, and hold onto the real share link once their app produces one. */

/* what a member reaches for: teams, players, positions and stat types, counted
   across every leg they have posted, graded or not */
function countsFor(id){
  const teams = {}, players = {}, pos = {}, stats = {}, sides = {More:0, Less:0};
  const flavors = {demon:0, goblin:0, standard:0};
  let total = 0;
  for(let w = 0; w < DEADLINES.length; w++){
    const p = (picksOf(w) || {})[id];
    if(!p) continue;
    total++;
    if(p.team) teams[p.team] = (teams[p.team]||0) + 1;
    const nm = p.player || "";
    if(nm) players[nm] = (players[nm]||0) + 1;
    const tag = posTag(p.stat, p.player);
    pos[tag] = (pos[tag]||0) + 1;
    if(p.stat) stats[p.stat] = (stats[p.stat]||0) + 1;
    if(p.side) sides[p.side] = (sides[p.side]||0) + 1;
    flavors[flavorOf(p)]++;
  }
  const rank = o => Object.keys(o).map(k => [k, o[k]]).sort((a,b) => b[1]-a[1] || (a[0] > b[0] ? 1 : -1));
  return {total:total, teams:rank(teams), players:rank(players), pos:rank(pos), stats:rank(stats),
          sides:sides, flavors:flavors};
}

function barList(rows, total, cap, empty){
  if(!rows.length) return '<p class="hint">' + empty + '</p>';
  const top = rows[0][1];
  return '<ul class="tally">' + rows.slice(0, cap || 5).map(([k, n]) =>
    '<li><span class="tk">' + esc(k) + '</span>'
    + '<span class="tb"><i style="width:' + Math.round(n/top*100) + '%"></i></span>'
    + '<span class="tn">' + n + '</span></li>').join("") + '</ul>';
}

/* What each graded leg did to a member's pick quality: how far it beat or missed
   its line in swings, whether the cap kicked in, and how many points of the 0 to
   100 score it is worth. The points add up to the score exactly. */
function qualityRows(id){
  const rows = [];
  for(let w = 0; w < DEADLINES.length; w++){
    if(!isLocked(w)) continue;
    const p = (picksOf(w) || {})[id];
    if(!p || !p.result) continue;
    const lq = legQuality(p), mg = margin(p);
    const raw = (lq === null || mg === null) ? null : Math.abs(mg) / spreadFor(p.stat, p.line);
    rows.push({w:w, p:p, lq:lq, raw:raw, spread:spreadFor(p.stat, p.line), capped: raw !== null && raw > 2});
  }
  const counted = rows.filter(r => r.lq !== null);
  counted.forEach(r => { r.pts = 25 * r.lq / counted.length; });
  return {rows: rows.reverse(), counted: counted};
}
const signed = (v, d) => (v > 0 ? "+" : v < 0 ? "\u2212" : "") + Math.abs(v).toFixed(d);
function qualityDrill(id){
  const {rows, counted} = qualityRows(id);
  const score = counted.length ? Math.round(50 + 25 * avg(counted.map(r => r.lq))) : null;
  const mean = counted.length ? avg(counted.map(r => r.lq)) : 0;
  return '<div class="card" id="drillpanel"><h3>' + esc(memberName(id)) + ', pick quality ' + q1(score) + '</h3>'
  + (counted.length
      ? '<p class="hint">Every member starts at 50. Each leg below moves the score up or down by the points shown, '
        + 'and those points add up to the score. A leg is worth how far it beat or missed its line, measured in swings, '
        + 'capped at 2 either way. ' + counted.length + ' leg' + (counted.length === 1 ? '' : 's') + ' averaging '
        + signed(mean, 2) + ' swings: 50 ' + (mean < 0 ? '\u2212' : '+') + ' ' + Math.abs(25 * mean).toFixed(1) + ' = ' + score + '.</p>'
      : '<p class="hint">Nothing graded yet.</p>')
  + (rows.length ? '<ul class="drill">' + rows.map(r => {
      const p = r.p, cls = p.result === "H" ? "h" : p.result === "M" ? "m" : "v";
      let how;
      if(r.lq === null) how = "void, does not count";
      else if(r.raw === null) how = (p.result === "H" ? "hit" : "missed") + " with no final entered, counted as " + signed(r.lq, 2);
      else how = (p.result === "H" ? "beat the line by " : "missed by ") + num1(Math.abs(margin(p)))
        + ", " + sw1(r.raw) + " swings" + (r.capped ? ", capped at 2" : "");
      return '<li><div class="dwk">WK' + (r.w+1) + '</div><div class="dbody">'
        + '<div class="dplayer">' + esc(p.player) + flavorTag(p) + (p.team ? ' <em>' + esc(p.team) + '</em>' : "") + '</div>'
        + '<div class="dprop">' + propText(p) + (p.actual != null ? ', final ' + esc(trim1(num(p.actual))) : '') + '</div>'
        + '<div class="dnum ' + cls + '">' + (r.lq === null ? 'no effect' : signed(r.pts, 1) + ' points') + '</div>'
        + '<div class="dfin">' + how + (r.lq !== null && r.raw !== null ? '. One swing at this line is ' + trim1(Math.round(r.spread * 10) / 10) : '') + '</div>'
        + '</div></li>';
    }).join("") + '</ul>' : "")
  + '<button class="btn ghost" id="closedrill">Close</button></div>';
}

function drillCard(){
  if(!state.drill) return "";

             + (L.pct !== null ? ", " + pct1(L.pct) : "")

  const byRate = a.table.slice().sort((x,y) =>
